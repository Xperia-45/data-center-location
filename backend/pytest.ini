[pytest]
testpaths = tests
pythonpath = .
addopts = -m "not live"
filterwarnings =
    ignore:Use `@` matmul instead:PendingDeprecationWarning
markers =
    live: hits real upstream services (Open-Meteo, Overpass, ESA WorldCover). Requires outbound internet; deselected by default.
    synthetic_payload: uses a locally generated stand-in for an upstream payload (clearly labelled, never presented as live data).
    fixture_only: exercises logic against in-test fixtures with no HTTP at all.
